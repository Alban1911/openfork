name: OpenFork V2 CI

on:
  push:
    branches:
      - migration/opencode-v2-antigravity
  pull_request:
    paths:
      - "packages/core/src/plugin/provider/**"
      - "packages/core/test/plugin/google-antigravity.test.ts"
      - ".github/workflows/openfork-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfork-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  antigravity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Typecheck V2 core
        run: bun --cwd packages/core typecheck
      - name: Antigravity tests
        run: cd packages/core && bun test test/plugin/google-antigravity.test.ts
