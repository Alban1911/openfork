name: fork-ci

on:
  push:
    branches:
      - main
      - dev
      - "migration/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync Upstream
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Typecheck V2 core
        run: bun --cwd packages/core typecheck

      - name: Typecheck V2 CLI
        run: bun --cwd packages/cli typecheck

      - name: Run Antigravity tests
        run: cd packages/core && bun test test/plugin/google-antigravity.test.ts
