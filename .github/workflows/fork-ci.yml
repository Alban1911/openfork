name: fork-ci

on:
  push:
    branches:
      - main
      - dev
      - gemini-thinking-level
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Typecheck OpenCode
        run: bun --cwd packages/opencode typecheck

      - name: Run Google Antigravity tests
        run: bun --cwd packages/opencode test test/plugin/google-antigravity.test.ts
